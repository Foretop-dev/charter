- path: network_egress/02_brave_web_search/tool.json
  capability: network_egress
- path: network_egress/02_brave_web_search/tool.json
  capability: read
- path: network_egress/03_slack_post_message/tool.json
  capability: network_egress
- path: network_egress/04_puppeteer_navigate/tool.json
  capability: network_egress

- path: code_execution/01_execute_command/tool.json
  capability: code_execution
- path: code_execution/02_run_script/tool.json
  capability: code_execution
- path: code_execution/03_puppeteer_evaluate/tool.json

name: CI

# Standalone equivalent of the monorepo's _reusable-ci.yml `check` job, without the
# apps/<app> path prefix — this repo IS charter, not one member of a workspace. Kept in sync
# by hand via scripts/sync-mirror.sh in the private monorepo; if you're editing this
# file directly in the mirror, also update it there so the next sync doesn't silently revert
# you. Named charter-ci.yml here (unlike ebb's own unprefixed ci.yml) purely because it arrived
# after ebb into a directory ebb already used — not a meaningful difference once copied into
# the mirror, where it becomes .github/workflows/ci.yml either way.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest tests -q

  enumeration-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install the Bubblewrap sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - run: uv sync --frozen
      - name: Prove hostile stdio servers remain confined
        run: uv run pytest tests/integration/test_enumeration_sandbox.py -q

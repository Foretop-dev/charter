name: "foretop charter — MCP capability scan"
description: >-
  Scans an agent configuration (.mcp.json, .cursor/mcp.json) for every MCP server, tool, and
  credential reference it grants access to, and fails the check when a pull request adds a new
  server or expands what an existing tool can do since the merge base.
author: "foretop"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Path to scan, relative to the repository root."
    required: false
    default: "."
  enumerate:
    description: >-
      On Linux, launch each stdio server inside Charter's fail-closed Bubblewrap sandbox and
      call its real tools/list, to classify capabilities. The repository is read-only and the
      server receives no host home, network, or configured credential environment. This is
      opt-in, never the default. Without it, only new-server drift is detected.
    required: false
    default: "false"
  base:
    description: >-
      Git ref to compare against. Exits 1 only if a server or tool capability is new or more
      severe than at the merge base with this ref — never an absolute threshold. Defaults to
      the pull request's base SHA; set to an empty string to disable the drift gate entirely
      (report-only).
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  comment-on-pr:
    description: "Upsert a summary comment on the pull request (true/false)."
    required: false
    default: "true"
  github-token:
    description: "Token used to read/write the PR comment. Needs pull-requests: write."
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: >-
      charter scan's own exit code: 0 no drift, 1 drift vs --base, 2 internal error (bad ref,
      not a git repo, or unavailable enumeration sandbox).
    value: ${{ steps.scan.outputs.exit-code }}

# Composite, not Docker or JS — same reasoning as apps/ebb's and apps/telltale's own action.yml
# (CLAUDE_CODE_PLAN.md Session 8): uvx already gives this a published, versioned artifact for
# free once foretop-charter ships to PyPI, so a container/build step would only duplicate that.
runs:
  using: "composite"
  steps:
    - name: Reject unsupported enumeration runners
      if: inputs.enumerate == 'true' && runner.os != 'Linux'
      shell: bash
      run: |
        echo "charter --enumerate requires a Linux runner and Bubblewrap; static scans work on this runner" >&2
        exit 2

    - name: Install the enumeration sandbox
      if: inputs.enumerate == 'true' && runner.os == 'Linux'
      shell: bash
      env:
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        set -eu

        sandbox_probe() {
          bwrap \
            --ro-bind / / \
            --unshare-all \
            --share-net \
            --die-with-parent \
            --new-session \
            --cap-drop ALL \
            --clearenv \
            -- /bin/true >/dev/null 2>&1
        }

        run_as_root() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo "$@"
          else
            return 126
          fi
        }

        if command -v bwrap >/dev/null 2>&1 && sandbox_probe; then
          exit 0
        fi

        # A reusable Action must not rewrite a customer's self-hosted machine. The runner
        # owner supplies Bubblewrap and any distribution-specific AppArmor policy there.
        if [ "${RUNNER_ENVIRONMENT:-self-hosted}" != "github-hosted" ]; then
          echo "Charter cannot establish Bubblewrap isolation on this self-hosted runner." >&2
          echo "Install Bubblewrap and allow its restricted user namespace (for Ubuntu 24.04, load bwrap-userns-restrict), then retry." >&2
          exit 2
        fi

        if ! command -v apt-get >/dev/null 2>&1; then
          echo "Charter's GitHub-hosted runner setup requires apt-get" >&2
          exit 2
        fi
        if ! run_as_root apt-get update || ! run_as_root apt-get install -y --no-install-recommends \
          bubblewrap apparmor-profiles apparmor-utils; then
          echo "Charter could not install the Bubblewrap sandbox on this GitHub-hosted runner" >&2
          exit 2
        fi

        apparmor_source=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
        apparmor_target=/etc/apparmor.d/bwrap-userns-restrict
        if [ ! -f "$apparmor_source" ]; then
          echo "The bwrap-userns-restrict AppArmor profile is unavailable on this GitHub-hosted runner" >&2
          exit 2
        fi
        if ! run_as_root install -m 0644 "$apparmor_source" "$apparmor_target" || \
          ! run_as_root apparmor_parser -r "$apparmor_target"; then
          echo "Charter could not load the restricted Bubblewrap AppArmor profile" >&2
          exit 2
        fi
        if ! sandbox_probe; then
          echo "Bubblewrap is installed but cannot create Charter's required isolation boundary" >&2
          exit 2
        fi

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0

    - name: Scan and emit PR annotations
      id: scan
      shell: bash
      run: |
        set +e
        args=(scan "${{ inputs.path }}" --format annotations)
        if [ "${{ inputs.enumerate }}" = "true" ]; then
          args+=(--enumerate)
        fi
        if [ -n "${{ inputs.base }}" ]; then
          args+=(--base "${{ inputs.base }}")
        fi
        uvx foretop-charter "${args[@]}"
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"

    - name: Render PR comment body
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      shell: bash
      run: |
        args=(scan "${{ inputs.path }}" --format markdown)
        if [ "${{ inputs.enumerate }}" = "true" ]; then
          args+=(--enumerate)
        fi
        if [ -n "${{ inputs.base }}" ]; then
          args+=(--base "${{ inputs.base }}")
        fi
        # The gate has already run in the previous step — --format markdown can itself exit 1
        # on the same drift, which would kill this step under `set -e` before the comment is
        # ever rendered. The exit code that actually fails the job is the earlier step's.
        set +e
        uvx foretop-charter "${args[@]}" > charter-comment-body.md
        exit 0

    # Find-and-edit by an HTML marker, never post a second comment on repeat pushes — see
    # scripts/upsert_pr_comment.sh (ebb's own copy, root of the repo) for the same logic this
    # app's copy (scripts/upsert_pr_comment.sh, relative to this action) duplicates on purpose.
    - name: Upsert PR comment
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_BODY_FILE: charter-comment-body.md
        COMMENT_MARKER: "<!-- foretop:charter:pr-comment -->"
      run: ${{ github.action_path }}/scripts/upsert_pr_comment.sh

    # Exit codes are an API (mirrors specs/ebb.md §6's rule): 0/1/2 must never be conflated.
    # `set +e` in the scan step kept it alive through a drift finding so the comment step still
    # ran — this is what actually fails the check, once everything else has had its turn.
    - name: Fail the check if capabilities drifted or an error occurred
      if: steps.scan.outputs.exit-code != '0'
      shell: bash
      run: exit ${{ steps.scan.outputs.exit-code }}
